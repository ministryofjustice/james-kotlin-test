permissions:
  contents: read
  security-events: write

jobs:
  security-snyk-check:
    name: Security snyk dependency check
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Snyk Security Scan
        id: snyk-scan
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/snyk-scan@fix_for_uv
        with:
          subproject: ''
          severity: 'HIGH,CRITICAL'
          scan_type: 'fs'
          location: '.'
          snyk_policy_path: ''
          github_token: ${{ secrets.GITHUB_TOKEN }}
          snyk_token: ${{ secrets.HMPPS_SNYK_API_KEY }}

      - name: Snyk slack notification
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/slack_snyk_scan_notification@fix_for_uv
        if: (failure() || steps.snyk-scan.outcome == 'failure' || steps.snyk-scan.outputs.results_count > 0) && inputs.channel_id != 'NO_SLACK'
        with:
          title: 'Snyk'
          warningOnly: ${{ steps.snyk-scan.outputs.sarif_upload_outcome == 'success' }}
          channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
          SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          subproject: ''
          scan_context: 'fs'
          summary: true
