name: Security trivy dependency check
on:
  workflow_dispatch:
  schedule:
    - cron: "3 10 * * MON-FRI" # Every weekday

jobs:
  security-kotlin-trivy-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security trivy dependency check
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_trivy.yml@98fb9aaeafc7970ea88f4d8a1145a5eb7029b609 #feat/migrate_to_shared_actions
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
