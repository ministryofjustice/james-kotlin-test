name: Security OWASP dependency check

on:    
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'The slack channel ID to send a message on failure. If this is not provided then no message is sent.'
        required: false
        default: 'NO_SLACK'
        type: string
      subproject:
        description: 'For gradle multi module projects, leave blank for single module projects'
        required: false
        default: ''
        type: string
      slack_include_summary:
        description: 'boolean to include a summary of vulnerabilities in the Slack message'
        required: false
        default: true
        type: boolean
      nvd_feed_version:
        description: 'version of the NVD feed to use'
        required: false
        default: '2'
        type: string
      java_version:
        type: string
        required: false
        default: '25'
    # secrets:
    #   HMPPS_SRE_SLACK_BOT_TOKEN:
    #     description: 'Slack bot token'
    #     required: false
    #   HMPPS_OSS_INDEX_USERNAME:
    #     description: 'Username for OWASP OSS Index analysis'
    #     required: false
    #   HMPPS_OSS_INDEX_PASSWORD:
    #     description: 'Password (API token) for OWASP OSS Index analysis'
    #     required: false

permissions:
  contents: read
  security-events: write

jobs:
  # NVD v2 API version of the scan - using self-hosted runner
  security-owasp-check-nvd2:
    name: Security OWASP dependency check (NVD API 2)
    runs-on:  [ self-hosted, hmpps-github-actions-runner-security ]
    if: github.repository_owner == 'ministryofjustice' && inputs.nvd_feed_version == '2'
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        distribution: 'temurin'
        java-version: '${{ inputs.java_version }}'
    - name: Run gradle OWASP Dependency Check Analyse
      id: owasp-analyse
      run: ./gradlew ${{ inputs.subproject }}:dependencyCheckAnalyze -Pdatafeed.url='file:///opt/vulnz/cache' -PossIndex.username=${{ secrets.HMPPS_OSS_INDEX_USERNAME }} -PossIndex.password=${{ secrets.HMPPS_OSS_INDEX_PASSWORD }}
      continue-on-error: true
    # Post-process SARIF to fix rule identifier length
    - name: Fix SARIF rule identifier length
      run: |
        SARIF_FILE="${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif"
        if [ -f "$SARIF_FILE" ]; then
          # Truncate rule IDs and related identifiers to max 255 characters
          jq '
            .runs[0].tool.driver.rules |= map(
              .id = (.id | if length > 255 then .[0:255] else . end) |
              .shortDescription.text = (.shortDescription.text // "" | if length > 500 then .[0:500] else . end)
            ) |
            .runs[0].results |= map(
              .ruleId = (.ruleId // "" | if length > 255 then .[0:255] else . end)
            )
          ' "$SARIF_FILE" > "${SARIF_FILE}.tmp" && mv "${SARIF_FILE}.tmp" "$SARIF_FILE"
          echo "✓ SARIF file processed: rule IDs and identifiers truncated to safe lengths"
        else
          echo "⚠ SARIF file not found: $SARIF_FILE"
        fi
      continue-on-error: true
    # Upload Sarif file: this will attempt to upload the sarif file for private/internal repositories as well
    - name: OWASP upload sarif
      id: owasp-upload-sarif
      uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        sarif_file: ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif
        category: gradle-owasp-dependency-check
      # don't stop the job even if Github Advanced Security isn't enabled
      continue-on-error: true
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      id: owasp-upload-artifact
      with:
        name: gradle-owasp-dependency-check-${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}.html
        path: ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.html
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      id: owasp-upload-artifact-sarif
      with:
        name: gradle-owasp-dependency-check-${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}.sarif
        path: ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif
    - name: Prepare OWASP summary
      id: owasp-summary
      run: |
        formatted_output=$(jq -r '.runs[0].tool.driver.rules[] | [.id, (.shortDescription // "N/A"), (.properties.cvssv2_score // "N/A"), (.properties.cvssv2_severity // "N/A")] | @tsv' ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif \
        | awk -F'\t' '{severity=$NF; score=$(NF-1); desc=$2; id=$1; if(severity ~ /:/) severity=substr(severity, index(severity,":")+1); printf "%s - %s (%s) - %s\n", id, severity, score, desc}' \
        | head -20) 
        echo "Vulnerability Summary"
        echo "====================="
        echo "${formatted_output}"
        slack_summary="$(echo "${formatted_output}" | awk '{s=s $0 "\n"} END {if (length(s) >= 3000) print substr(s, 1, 2997) "..."; else print s}')"
        echo "summary<<EOF" >> $GITHUB_ENV
        echo "$slack_summary" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
    - name: Gradle OWASP slack notification
      uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/slack_codescan_notification@payload_fix
      if: (failure() || steps.owasp-analyse.outcome == 'failure') && inputs.channel_id != 'NO_SLACK'
      with:
        title: "Gradle OWASP"
        warningOnly: ${{ steps.owasp-upload-sarif.outcome == 'success' && steps.owasp-upload-artifact.outcome == 'success' }}
        channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}
        SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
        subproject: ${{ inputs.subproject }}
        summary: ${{ inputs.slack_include_summary && env.summary || '' }}
  # Previous NVD API version - this will no longer be default when the database is no longer available
  security-owasp-check-nvd1:
    name: Security OWASP dependency check (NVD API 1)
    runs-on:  ubuntu-latest
    if: inputs.nvd_feed_version == '1'
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Run gradle OWASP Dependency Check Analyse
      id: owasp-analyse
      run: ./gradlew ${{ inputs.subproject }}:dependencyCheckAnalyze --info
      continue-on-error: true
    # Post-process SARIF to fix rule identifier length
    - name: Fix SARIF rule identifier length
      run: |
        SARIF_FILE="${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif"
        if [ -f "$SARIF_FILE" ]; then
          # Truncate rule IDs and related identifiers to max 255 characters
          jq '
            .runs[0].tool.driver.rules |= map(
              .id = (.id | if length > 255 then .[0:255] else . end) |
              .shortDescription.text = (.shortDescription.text // "" | if length > 500 then .[0:500] else . end)
            ) |
            .runs[0].results |= map(
              .ruleId = (.ruleId // "" | if length > 255 then .[0:255] else . end)
            )
          ' "$SARIF_FILE" > "${SARIF_FILE}.tmp" && mv "${SARIF_FILE}.tmp" "$SARIF_FILE"
          echo "✓ SARIF file processed: rule IDs and identifiers truncated to safe lengths"
        else
          echo "⚠ SARIF file not found: $SARIF_FILE"
        fi
      continue-on-error: true
    # Upload Sarif file: this will attempt to upload the sarif file for private/internal repositories as well
    - name: OWASP upload sarif
      id: owasp-upload-sarif
      uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        sarif_file: ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif
        category: gradle-owasp-dependency-check
      # don't stop the job even if Github Advanced Security isn't enabled
      continue-on-error: true
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      id: owasp-upload-artifact
      with:
        name: gradle-owasp-dependency-check-${{ inputs.subproject == '' && github.event.repository.name || inputs.subproject }}
        path: ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.html
    - name: Prepare OWASP summary
      id: owasp-summary
      run: |
        formatted_output=$(jq -r '.runs[0].tool.driver.rules[] | [.id, (.shortDescription // "N/A"), (.properties.cvssv2_score // "N/A"), (.properties.cvssv2_severity // "N/A")] | @tsv' ${{ inputs.subproject == '' && '.' || inputs.subproject }}/build/reports/dependency-check-report.sarif \
        | awk -F'\t' '{severity=$NF; score=$(NF-1); desc=$2; id=$1; if(severity ~ /:/) severity=substr(severity, index(severity,":")+1); printf "%s - %s (%s) - %s\n", id, severity, score, desc}' \
        | head -20) 
        echo "Vulnerability Summary"
        echo "====================="
        echo "${formatted_output}"
        slack_summary="$(echo "${formatted_output}" | awk '{s=s $0 "\n"} END {if (length(s) >= 3000) print substr(s, 1, 2997) "..."; else print s}')"
        echo "summary<<EOF" >> $GITHUB_ENV
        echo "$slack_summary" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
    - name: Gradle OWASP slack notification
      uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/slack_codescan_notification@payload_fix
      if: (failure() || steps.owasp-analyse.outcome == 'failure') && inputs.channel_id != 'NO_SLACK'
      with:
        title: "Gradle OWASP"
        warningOnly: ${{ steps.owasp-upload-sarif.outcome == 'success' && steps.owasp-upload-artifact.outcome == 'success' }}
        channel_id: ${{ inputs.channel_id}}
        SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
        subproject: ${{ inputs.subproject }}
        summary: ${{ inputs.slack_include_summary && env.summary || '' }}
