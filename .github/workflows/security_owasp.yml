name: Security OWASP dependency check
on:
  workflow_dispatch:
  schedule:
    - cron: "3 10 * * MON-FRI" # Every weekday

jobs:
  security-kotlin-owasp-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Kotlin security OWASP dependency check
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_owasp.yml@5daf63fbd4be352ac1b66ae667c60ba1959e1063
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      nvd_feed_version: '2'
      java_version: "25"
    secrets: inherit
