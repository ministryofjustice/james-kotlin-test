---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-cronjob
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  schedule: "05 14 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 5
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 345600
      template:
        spec:
          containers:
            - name: test-cronjob
              image: ghcr.io/ministryofjustice/hmpps-devops-tools:latest
              command:
                - /usr/bin/sleep
                - "36000"
              securityContext:
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
          restartPolicy: Never
